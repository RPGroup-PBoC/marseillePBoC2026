- day: Monday
  date: 10/12/2026
  topic: >
    A feeling for the organism. What sets the scale of X? The cell as a bag of X. Order of magnitude thinking, scaling estimates and dimensionless numbers as tools for understanding biology.

- day: Tuesday
  date: 10/13/2026
  topic: >
    Stuff of t and biology’s unique laws of dynamics. Different update rules in biology, the dynamics of mRNA and the ubiquitous dynamics of turnover. Probability distributions and their appearance in biological phenomena. Chemical master equations as a theory of the histogram.

- day: Wednesday
  date: 10/14/2026
  topic: >
    Making our guesses precise: null hypotheses and the great probability distributions. Diffusion as our dynamical null hypothesis. Exploratory processes and when diffusion is not enough.
   
- day: Thursday
  date: 10/15/2026
  topic: >
    The Secret of Life: Defiance. Defying the call to equilibrium and examples of biological defiance. Thinking about ATP consumption and its biological consequences.

- day: Friday
  date: 10/16/2026
  topic: >
    Vectors and representations. Rethinking the idea of a vector, from Descartes (x,y) to ChatGPT. Different concepts of regression and fitting, the eigenworm, and describing biological phenomena with minimal variables. Overview of physical biology, what has been achieved, what next?
